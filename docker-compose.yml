# Translated from apps/docker-compose.yml. The Go version left "postgres"
# and "temperature-api" as TODO placeholders (task 5.2/5.3 of the
# assignment) - filled in here the same way the finished Go solution
# would be: postgres initialized from db/init.sql, temperature-api on 8081,
# app on 8080, all sharing the smarthome-network.

services:
  postgres:
    image: postgres:16-alpine
    container_name: smarthome-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      # No POSTGRES_DB here on purpose: init.sql (unchanged from the Go repo)
      # issues its own CREATE DATABASE smarthome, so the init script must run
      # against the default "postgres" database, not one Postgres already
      # created for us - otherwise CREATE DATABASE fails ("already exists")
      # and aborts the script before the sensors table gets created.
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - smarthome-network

  temperature-api:
    build:
      context: ./src/TemperatureApi
      dockerfile: Dockerfile
    container_name: temperature-api
    environment:
      - PORT=8081
    ports:
      - "8081:8081"
    restart: unless-stopped
    networks:
      - smarthome-network

  app:
    build:
      context: ./src/SmartHome.Api
      dockerfile: Dockerfile
    container_name: smarthome-app
    depends_on:
      postgres:
        condition: service_healthy
      temperature-api:
        condition: service_started
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/smarthome
      - TEMPERATURE_API_URL=http://temperature-api:8081
      - PORT=8080
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - smarthome-network

volumes:
  postgres_data:

networks:
  smarthome-network:
    driver: bridge
